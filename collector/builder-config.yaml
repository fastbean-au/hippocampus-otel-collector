# OpenTelemetry Collector Builder (OCB) manifest for a collector that ships the Hippocampus logs
# exporter. Build with:
#
#   go install go.opentelemetry.io/collector/cmd/builder@v0.160.0
#   builder --config builder-config.yaml
#
# then run the generated binary against ./config.yaml:
#
#   ./_build/hippocampus-otelcol --config config.yaml
#
# See README.md for the end-to-end walkthrough.

dist:
  module: github.com/fastbean-au/hippocampus-otel-collector/collector
  name: hippocampus-otelcol
  description: OpenTelemetry Collector with the Hippocampus logs exporter.
  version: 0.0.1
  output_path: ./_build
  otelcol_version: 0.160.0

receivers:
  - gomod: go.opentelemetry.io/collector/receiver/otlpreceiver v0.160.0
  - gomod: github.com/open-telemetry/opentelemetry-collector-contrib/receiver/filelogreceiver v0.160.0

processors:
  - gomod: go.opentelemetry.io/collector/processor/batchprocessor v0.160.0

exporters:
  - gomod: go.opentelemetry.io/collector/exporter/debugexporter v0.160.0
  - gomod: github.com/fastbean-au/hippocampus-otel-collector/hippocampusexporter v0.0.0

# Local source: the exporter lives beside this manifest, relative to the generated go.mod under
# _build/. It used to take a second replace pointing four levels up at the monorepo root for the
# Hippocampus contract; out here the exporter requires a released version of that module like any
# other dependency, so there is one local source rather than two.
replaces:
  - github.com/fastbean-au/hippocampus-otel-collector/hippocampusexporter => ../../hippocampusexporter
