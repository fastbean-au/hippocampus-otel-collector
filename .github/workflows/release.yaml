name: Release

# Publishes the collector image on a vX.Y.Z tag.
#
# The version line CONTINUES the service's rather than restarting: this image has been published to
# ghcr.io/fastbean-au/hippocampus-otel-collector at the service version since it existed, and the
# metadata action's {{major}}.{{minor}} tag would read a restart at 0.1.0 as older than what is
# already there. The first release cut from this repository is therefore v0.48.0, and the line is
# free to diverge from the service's after that.
on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to release (e.g. v0.48.0)"
        required: true

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  RELEASE_TAG: ${{ inputs.tag || github.ref_name }}

jobs:
  # Gate the publish on the tests passing, so a red build publishes nothing.
  test:
    runs-on: ubuntu-latest

    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ env.RELEASE_TAG }}

      - uses: actions/setup-go@v7
        with:
          go-version-file: hippocampusexporter/go.mod
          # The module is not at the repository root, so the default cache lookup finds no
          # dependencies file and the restore is skipped with a warning on every run.
          cache-dependency-path: hippocampusexporter/go.sum

      - name: Build, vet, and test
        working-directory: hippocampusexporter
        run: |
          go build ./...
          go vet ./...
          go test ./...

  publish:
    needs: test
    runs-on: ubuntu-latest

    permissions:
      contents: write # create the GitHub release
      packages: write # push to GHCR

    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ env.RELEASE_TAG }}

      # QEMU for the alpine RUN steps, Buildx for the multi-platform manifest. OCB itself runs
      # native on the build host and cross-compiles the collector, so nothing emulates the toolchain.
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # The image name is a LITERAL, not ghcr.io/${{ github.repository }}. In the monorepo that
      # expression plus a `-otel-collector` suffix produced the right name; here it would produce
      # ghcr.io/fastbean-au/hippocampus-otel-collector-otel-collector, and the published package
      # would silently become a second, differently named one.
      - name: Derive collector image tags
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/fastbean-au/hippocampus-otel-collector
          tags: |
            type=semver,pattern={{version}},value=${{ env.RELEASE_TAG }}
            type=semver,pattern={{major}}.{{minor}},value=${{ env.RELEASE_TAG }}

      - name: Build and push collector image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: collector/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          build-args: |
            VERSION=${{ env.RELEASE_TAG }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

      - name: Create the GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail

          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            echo "release $RELEASE_TAG already exists"
            exit 0
          fi

          gh release create "$RELEASE_TAG" \
            --title "$RELEASE_TAG" \
            --generate-notes \
            --verify-tag
